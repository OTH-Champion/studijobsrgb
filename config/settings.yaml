# Einstellungen für die Auswahl der Stellen

# Orte, die als "Regensburg" zählen (Stadt + direktes Umland, z. B. Krones in Neutraubling)
region:
  - Regensburg
  - Neutraubling
  - Obertraubling
  - Barbing
  - Lappersdorf
  - Pentling
  - Regenstauf
  - Tegernheim
  - Wenzenbach
  - Sinzing
  - Pettendorf
  - Zeitlarn
  - Donaustauf
  - Mintraching

# Stellen mit diesen Ortsangaben werden ebenfalls aufgenommen (Standort "bundesweit").
# Gilt nur für Ortsangaben (Stellenkarte, Ortsfeld, Link), nicht für den Fließtext der Anzeige.
bundesweit:
  - bundesweit
  - deutschlandweit

# Stellenart: Titel muss eines dieser Muster enthalten (Kleinschreibung, Muster gilt ab Wortanfang, Regex erlaubt)
include_title:
  - praktik          # Praktikum, Praktikant
  - pflichtprakt
  - intern(ship)?\b  # Intern, Internship (nicht: international)
  - werkstud
  - werksstud
  - working student
  - studentische
  - student assistant
  - junior
  - trainee
  - einsteiger
  - berufseinst
  - absolvent
  - graduate
  - entry level
  - young professional
  - career starter

# Diese Stellen fliegen immer raus
exclude_title:
  - schülerprakt
  - schuelerprakt
  - berufsorientierung
  - career orientation
  - schnupper
  - ausbildung
  - auszubild
  - azubi
  - dual
  - apprentice
  - abschlussarbeit
  - bachelorarbeit
  - masterarbeit
  - thesis
  - doktor
  - phd

# Erlaubte Fachbereiche (so werden sie auf der Seite angezeigt)
fachbereiche:
  - Vertrieb & Kundenmanagement
  - Einkauf & Supply Chain
  - Marketing & Kommunikation
  - Finanzen & Controlling
  - Business Development & Strategie
  - Personal (HR)
  - Projektmanagement
  - Digitalisierung, Daten & KI
  - Recht & Compliance
  - Sonstiges BWL
